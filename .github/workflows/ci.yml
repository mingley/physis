name: ci

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0-rc2
  LEAN4EXPORT_REV: 411dce7db58a3afc60ecab2d211acd1042b593dc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/lean4export
          key: ${{ runner.os }}-${{ env.LEAN_TOOLCHAIN }}-export-${{ env.LEAN4EXPORT_REV }}
      - name: Install Lean 4.34 and lean4export
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
              | sh -s -- -y --default-toolchain "$LEAN_TOOLCHAIN"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$LEAN_TOOLCHAIN"
          dest="$HOME/lean4export"
          bin="$dest/.lake/build/bin/lean4export"
          if [ ! -x "$bin" ]; then
            rm -rf "$dest"
            git clone https://github.com/leanprover/lean4export.git "$dest"
            git -C "$dest" checkout "$LEAN4EXPORT_REV"
            (cd "$dest" && lake build)
          fi
          echo "LEAN4EXPORT=$bin" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p physis -- experiment string-critique
      - run: cargo run -p physis -- prove dec.d-squared-zero
